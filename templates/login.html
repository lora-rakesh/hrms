{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Company | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merienda&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=3">
</head>
<body>

    <div class="welcome-title">Welcome to <strong>MyCompany</strong></div>

    <div class="login-wrapper">
        <div class="login-box">
            <h3>Login</h3>
            <hr>
            <form method='POST'>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Employee ID</label>
                    <input class="form-control" type="text" name="username" placeholder="Employee ID" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input class="form-control" type="password" name="password" placeholder="Password" required>
                </div>
                <div class="password-links">
                    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                    <a href="{% url 'reset_password' %}">Reset Password?</a>
                </div>
                <button class="btn btn-primary">Login</button>
                {% if message %}
                    <div class="text-danger text-center">{{ message }}</div>
                {% endif %}
            </form>
        </div>
    </div>

</body>

</html>
