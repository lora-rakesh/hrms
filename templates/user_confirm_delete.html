<!DOCTYPE html>
<html lang="en">

    <head>

        {% load static %}
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/company_delete.css' %}">
        <title>User delete | Company</title>
        <style>
            /* Delete Confirmation Dialog Styles */
body {
    font-family: 'Roboto', sans-serif;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    color: #333;
}

.delete-container {
    background-color: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    padding: 2.5rem;
    max-width: 500px;
    width: 100%;
    text-align: center;
}

.warning-icon {
    font-size: 3rem;
    display: block;
    margin-bottom: 1.5rem;
    color: #f59e0b;
}

.delete-title {
    font-size: 1.75rem;
    font-weight: 500;
    margin-bottom: 1.25rem;
    color: #1f2937;
}

.delete-message {
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
    color: #4b5563;
}

.company-name {
    font-weight: 500;
    color: #1f2937;
}

.button-group {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 1.5rem;
}

.delete-button {
    background-color: #ef4444;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.delete-button:hover {
    background-color: #dc2626;
    transform: translateY(-1px);
}

.cancel-button {
    background-color: white;
    color: #4b5563;
    border: 1px solid #d1d5db;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

.cancel-button:hover {
    background-color: #f9fafb;
    border-color: #9ca3af;
    transform: translateY(-1px);
}

/* Responsive adjustments */
@media (max-width: 576px) {
    .delete-container {
        padding: 1.75rem;
    }
    
    .button-group {
        flex-direction: column;
    }
    
    .delete-button,
    .cancel-button {
        width: 100%;
    }
}
        </style>
    </head>

    <body>

        <div class="delete-container">
            <span class="warning-icon">⚠️</span>
            <h1 class="delete-title">Delete user</h1>
            <p class="delete-message">
                Are you sure you want to delete <span class="company-name">"{{ emp.employee_id }}"</span>?<br>
                This action cannot be undone.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="button-group">
                    <button type="submit" class="delete-button">Yes, delete</button>
                    <a href="/user_list" class="cancel-button">Cancel</a>
                </div>
            </form>
        </div>

    </body>

</html>
