{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | MyCompany</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;/* Black to Pink */
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}


    .container {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-width: 460px;
      width: 100%;
    }

    h2 {
      text-align: center;
      font-size: 28px;
      color: darkgreen;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: black greenyellow;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: #8e2de2;
      box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.3);
      outline: none;
    }

    .password-input-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #777;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #6a0dad, #8e2de2);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(to right, #5e0cac, #7a1ede);
    }

    .alert {
      background: #f5e1ff;
      color: #4b0082;
      padding: 12px;
      margin-top: 20px;
      border-left: 4px solid #6a0dad;
      border-radius: 6px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Password</h2>
    <form method="POST" id="resetForm">
      {% csrf_token %}

      <div class="form-group">
        <label for="employee_id">Employee ID</label>
        <input type="text" id="employee_id" name="employee_id" class="form-control"
          placeholder="Enter your employee ID" required />
      </div>

      <div class="form-group">
        <label for="old_password">Old Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="old_password" name="old_password" class="form-control"
            placeholder="Enter your old password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="new_password" name="new_password" class="form-control"
            placeholder="Enter your new password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
            placeholder="Confirm your new password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <button type="submit" class="btn"><i class="fas fa-lock"></i> Reset Password</button>

      {% if messages %}
      <div class="alert">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
    </form>
  </div>

  <script>
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
        const input = this.previousElementSibling;
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });
    });

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
      } else {
        const btn = this.querySelector('button');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
      }
    });
  </script>
</body>
</html>
