{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{% static 'css/reset_password.css' %}">
  <meta charset="UTF-8" />
  <title>Reset Password | MyCompany</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h2>Reset Password</h2>
    <form method="POST" id="resetForm">
      {% csrf_token %}

      <div class="form-group">
        <label for="employee_id">Employee ID</label>
        <input type="text" id="employee_id" name="employee_id" class="form-control"
          placeholder="Enter your employee ID" required />
      </div>

      <div class="form-group">
        <label for="old_password">Old Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="old_password" name="old_password" class="form-control"
            placeholder="Enter your old password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="new_password" name="new_password" class="form-control"
            placeholder="Enter your new password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
            placeholder="Confirm your new password" required />
          <i class="toggle-password fas fa-eye"></i>
        </div>
      </div>

      <button type="submit" class="btn"><i class="fas fa-lock"></i> Reset Password</button>

      {% if messages %}
      <div class="alert">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
    </form>
  </div>

  <script>
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
        const input = this.previousElementSibling;
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });
    });

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert('Passwords do not match!');
      } else {
        const btn = this.querySelector('button');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
      }
    });
  </script>
</body>
</html>
